# Ponte do WhatsApp da T9, para rodar no PC (Docker Desktop) ou num servidor.
#   docker compose up -d
# Sobe a ponte e um túnel rápido da Cloudflare: o túnel dá um endereço público ao PC, sem abrir
# porta no roteador, e a ponte avisa o painel desse endereço sozinha (ele muda a cada reinício).
services:
  ponte:
    build: .
    env_file: .env
    environment:
      TUNEL_METRICAS: http://tunel:2000
    restart: unless-stopped
    volumes:
      - sessao:/app/.data

  tunel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://ponte:3100"]
    restart: unless-stopped
    depends_on:
      - ponte

volumes:
  sessao:
