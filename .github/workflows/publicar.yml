name: Publicar na Vercel

# Publica o site a cada push no branch de produção.
#
# POR QUE ESTE ARQUIVO EXISTE
# O projeto na Vercel não está conectado ao GitHub — os deploys vinham do CLI,
# na mão, e por isso nenhum commit chegava ao site sozinho. Conectar esbarra num
# detalhe de contas: a conta Vercel está atrelada a um login do GitHub diferente
# do dono deste repositório. Este workflow contorna tudo isso — o GitHub Actions
# alcança a Vercel normalmente e publica por conta própria.
#
# CONFIGURAÇÃO (uma vez só)
# Um segredo, só um. Em Settings → Secrets and variables → Actions:
#
#   VERCEL_TOKEN   vercel.com/account/tokens → Create Token
#
# Os IDs abaixo, em env, cobrem os dois tipos de token que a Vercel emite —
# o de equipe e o de projeto (aquele criado entrando pela setinha do "hian" e
# escolhendo clube-forense). O de projeto NÃO tem usuário associado: com ele,
# `vercel whoami` responde "User not found" e `vercel link --scope` falha com
# 404. Por isso aqui não há link nenhum; os IDs vão direto, que é o caminho
# que funciona para os dois.
#
# CUIDADO: existe outro projeto na mesma equipe, chamado "meap", conectado a
# ESTE repositório no GitHub mas servindo engquerencosta.com.br. Não é o Clube
# Forense. É por isso que o VERCEL_PROJECT_ID abaixo está fixo e conferido —
# publicar no projeto errado troca o site errado.
#
# As variáveis do site (CURADORIA_CSV_URL etc.) NÃO entram aqui. O `vercel pull`
# busca as que já estão cadastradas no projeto — este workflow nunca as vê.
#
# Se um dia o GitHub for conectado à Vercel pelo painel, apague este arquivo:
# os dois publicando ao mesmo tempo geraria deploy duplicado a cada push.

on:
  push:
    branches:
      - claude/gracious-euler-7kzav0
  # Permite publicar manualmente pelo botão "Run workflow", sem precisar de commit.
  workflow_dispatch: {}

# Se dois pushes acontecerem juntos, o mais novo cancela o anterior — evita
# dois deploys correndo e um resultado imprevisível de qual vence.
concurrency:
  group: publicar-vercel
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      # Identificam o projeto; não autorizam nada. Sem um token válido a Vercel
      # os ignora, então não são segredo — e ficam à vista de propósito: como
      # segredos, ninguém conseguia conferir se estavam certos, e foi
      # exatamente essa cegueira que custou onze execuções falhadas. Estes dois
      # foram lidos da API da Vercel, e o projeto é o que responde por
      # clube-forense-three.vercel.app.
      VERCEL_ORG_ID: team_oC9ouzmp2nyfMiZXcQUkGK9t
      VERCEL_PROJECT_ID: prj_nF3Nuik4bT6aWNpNAgYRNhs2FNFr

    steps:
      # Sem isto, o token faltando só apareceria como erro obscuro do CLI lá
      # adiante. Aqui a mensagem diz exatamente o que cadastrar.
      - name: Conferir o segredo
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta o segredo VERCEL_TOKEN — cadastre em Settings → Secrets and variables → Actions."
            exit 1
          fi

          # O FORMATO do token, nunca o valor. O GitHub esconde o segredo
          # inteiro no log, mas não um pedaço dele nem sua contagem — e é
          # justamente isso que distingue as três coisas que a Vercel reporta
          # com a mesma frase: colado pela metade, colado com quebra de linha,
          # e revogado. Sem isto, cada tentativa custa uma ida e volta.
          echo "Começa com: $(printf %s "$TOKEN" | cut -c1-4)   (esperado: vcp_)"
          echo "Caracteres: $(printf %s "$TOKEN" | wc -c)       (esperado: 28 ou mais)"
          case "$TOKEN" in
            *[[:space:]]*)
              echo "::warning::O valor tem espaço ou quebra de linha no meio — recolar costuma resolver." ;;
            *)
              echo "Sem espaços." ;;
          esac

      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar o CLI da Vercel
        run: npm install --global vercel@latest

      # Só informação, nunca derruba o build: diz que tipo de token está em uso.
      #
      # "User not found" AQUI É NORMAL para um token de projeto — ele não tem
      # usuário associado. Não é sinal de token inválido, e foi o que nos
      # confundiu por uma rodada inteira. O que vale é o passo seguinte.
      - name: Que tipo de token é este
        run: |
          if vercel whoami --token="${{ secrets.VERCEL_TOKEN }}" 2>/dev/null; then
            echo "→ Token de conta/equipe."
          else
            echo "→ Token de projeto (sem usuário associado). Normal."
          fi

      # Traz a configuração do projeto e as variáveis de ambiente já cadastradas
      # na Vercel — é assim que CURADORIA_CSV_URL entra no build. Os IDs do env
      # acima é que dizem qual projeto; não há `vercel link` porque ele exige
      # resolver um usuário, coisa que um token de projeto não tem.
      - name: Buscar a configuração do projeto
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Compilar
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Publicar
        id: publicar
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado em: $url"

      # Fecha o ciclo: em vez de você ir conferir na mão qual código subiu, o
      # próprio workflow pergunta ao site e mostra a resposta no log.
      - name: Conferir o que ficou no ar
        run: |
          url="${{ steps.publicar.outputs.url }}"
          echo "Consultando $url/api/versao ..."
          if resposta=$(curl -fsS --retry 5 --retry-delay 3 "$url/api/versao"); then
            echo "$resposta"
            echo "$resposta" | grep -q '"curadoriaConfigurada":true' \
              && echo "Curadoria: lendo da planilha." \
              || echo "::warning::CURADORIA_CSV_URL não está neste projeto — o site vai usar a curadoria embutida no código."
          else
            echo "::warning::Não consegui ler /api/versao. O deploy saiu, mas confira o site."
          fi

      - name: Resumo
        run: |
          echo "### Publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Endereço do deploy: ${{ steps.publicar.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://clube-forense-three.vercel.app" >> "$GITHUB_STEP_SUMMARY"
